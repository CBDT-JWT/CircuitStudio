<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Circuit Studio</title><link rel="stylesheet" href="./studio.css"><script type="module" src="./editor.mjs"></script></head>
<body>
 <main id="studio" aria-label="Circuit Studio 工程编辑器">
  <svg id="canvas" data-testid="schematic-canvas" tabindex="0" aria-label="电路画布"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".45" fill="#cbd4ce"/></pattern></defs><rect id="grid-fill" fill="url(#grid)"/><g id="drawing"></g><g id="interaction"></g></svg>
  <header id="document-bar"><nav id="tabs" aria-label="工程标签页"></nav><button data-action="new" class="icon" title="新建工程 ⌘N" aria-label="新建工程">＋</button><button data-action="open" class="icon" title="打开工程 ⌘O" aria-label="打开工程">↗</button><div id="hierarchy"></div></header>
  <aside id="library" class="glass" aria-label="元件库"><div class="library-heading"><strong data-i18n="components">元件库</strong><span>78</span><button data-action="library" class="icon" aria-label="收起元件库">‹</button></div><label class="search"><span>⌕</span><input id="search" type="search" aria-label="搜索元件" placeholder="搜索元件"></label><div id="library-sections"></div></aside>
  <section id="properties" class="glass" aria-label="元件参数" hidden></section>
  <div id="probe-banner" class="glass" hidden><span>点选导线、网络标签或引脚</span><button data-action="probe-finish">完成 · Esc</button></div>
  <nav id="tools" class="glass" aria-label="绘图工具">
   <details><summary data-i18n="file">文件</summary><div class="menu"><button data-action="new">新建工程 <kbd>⌘N</kbd></button><button data-action="open">打开工程… <kbd>⌘O</kbd></button><button data-action="save">保存 <kbd>⌘S</kbd></button><button data-action="save-as">另存为… <kbd>⇧⌘S</kbd></button><div id="recent"></div><hr><button data-action="import-spice">导入 SPICE…</button><button data-action="export-png">导出 PNG…</button><button data-action="export-svg">导出 SVG…</button><button data-action="virtuoso-png">Virtuoso 风格 PNG…</button><button data-action="virtuoso-svg">Virtuoso 风格 SVG…</button></div></details>
   <details><summary data-i18n="edit">编辑</summary><div class="menu"><button data-action="undo">撤销 <kbd>⌘Z</kbd></button><button data-action="redo">重做 <kbd>⇧⌘Z</kbd></button><button data-action="copy">复制为 PNG <kbd>⌘C</kbd></button><button data-action="cut">剪切 <kbd>⌘X</kbd></button><button data-action="paste">粘贴 <kbd>⌘V</kbd></button><button data-action="duplicate">重复 <kbd>⌘D</kbd></button><button data-action="delete">删除 <kbd>⌫</kbd></button><button data-action="select-all">全选 <kbd>⌘A</kbd></button><hr><button data-action="rotate">旋转 <kbd>R</kbd></button><button data-action="flip-x">左右翻转 <kbd>X</kbd></button><button data-action="flip-y">上下翻转 <kbd>Y</kbd></button></div></details>
   <details><summary data-i18n="circuit">电路</summary><div class="menu"><button data-action="cells">管理层级单元…</button><button data-action="pdk">PDK 绑定与模型…</button><button data-action="netlist">查看 SPICE 网表…</button><button data-action="check">检查连接</button></div></details>
   <span class="tool-divider"></span>
   <button data-action="select" class="icon active" aria-label="选择工具" title="选择 · Esc">↖</button><button data-action="library" class="icon active" id="library-toggle" aria-label="元件库" title="元件库">⊞</button><button data-action="wire" class="icon" aria-label="连线" title="连线 W">⌁</button><button data-action="rail" class="icon" aria-label="电源轨" title="电源轨">⊤</button><button data-action="text" class="icon" aria-label="文字" title="文字 T">T</button><button data-action="undo" class="icon" aria-label="撤销" title="撤销 ⌘Z">↶</button><button data-action="redo" class="icon" aria-label="重做" title="重做 ⇧⌘Z">↷</button><button data-action="fit" class="icon" aria-label="适应画布" title="适应画布 F">⌖</button>
  </nav>
  <footer id="statusbar"><output id="status" aria-live="polite">就绪</output><div><button data-action="shortcuts">快捷键</button><button data-action="grid" id="grid-toggle">网格</button><button data-action="zoom-out" aria-label="缩小">−</button><button data-action="fit" id="zoom">100%</button><button data-action="zoom-in" aria-label="放大">＋</button><button data-action="language" id="language">English</button></div></footer>
  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <input id="file-input" type="file" accept=".json,.sp,.spi,.spice,.cir,.txt" hidden>
 </main>
</body></html>
